version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: locacar_postgres
    environment:
      POSTGRES_USER: locacar_user
      POSTGRES_PASSWORD: locacar_password
      POSTGRES_DB: locacar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - locacar_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locacar_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: locacar_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - locacar_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: locacar_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://locacar_user:locacar_password@postgres:5432/locacar_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_here
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app/src/backend
    networks:
      - locacar_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: locacar_frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./src/frontend:/app/src/frontend
    networks:
      - locacar_network

  minio:
    image: minio/minio:latest
    container_name: locacar_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    networks:
      - locacar_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: locacar_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - locacar_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  locacar_network:
    driver: bridge
